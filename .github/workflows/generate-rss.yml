name: Generate RSS from Grist

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *' # S'exécute toutes les 30 minutes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests python-dateutil

      - name: Generate RSS
        env:
          GRIST_API_KEY: ${{ secrets.GRIST_API_KEY }}
        run: python scripts/generate_rss.py

      - name: Commit and push gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Vérifie si la branche gh-pages existe, sinon la crée
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout gh-pages
            git pull origin gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf .
          fi
          
          # Récupère le fichier généré depuis le dossier temporaire ou le commit précédent
          git checkout main -- scripts/
          python scripts/generate_rss.py
          
          git add rss.xml
          git commit -m "Update rss.xml from Grist: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "No changes to commit"
          git push origin gh-pages
