name: Generate RSS from Grist

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *' # S'exécute toutes les 30 minutes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests python-dateutil

      - name: Commit and push gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 1. Sauvegarde temporairement le script Python
          mkdir -p /tmp/scripts
          cp scripts/generate_rss.py /tmp/scripts/
          
          # 2. Bascule sur la branche gh-pages (et la crée de zéro si elle n'existe pas encore)
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout gh-pages
            git pull origin gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf .
          fi
          
          # 3. Restaure le script dans cette branche et génère le fichier rss.xml
          mkdir -p scripts
          cp /tmp/scripts/generate_rss.py scripts/
          python scripts/generate_rss.py
          
          # 4. Crée le fichier magique .nojekyll pour désactiver les filtres de GitHub Pages
          touch .nojekyll
          
          # 5. Enregistre et publie uniquement le flux RSS et le fichier .nojekyll
          git add rss.xml .nojekyll
          git commit -m "Update rss.xml from Grist: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "No changes to commit"
          git push origin gh-pages
