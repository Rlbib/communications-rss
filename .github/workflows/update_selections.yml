name: Mettre à jour les Sélections Grist

on:
  schedule:
    # Tourne toutes les 2 heures
    - cron: '0 */2 * * *'
  workflow_dispatch: # Permet de lancer manuellement

permissions:
  contents: write # Autorise le robot à enregistrer selections.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: pip install requests

      - name: Exécuter le script
        env:
          GRIST_API_KEY: ${{ secrets.GRIST_API_KEY }}
        run: python scripts/build_selections.py

      - name: Sauvegarder et publier selections.json
        run: |
          git config --global user.name 'Robot Grist'
          git config --global user.email 'robot@github.com'
          git add selections.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour automatique de selections.json" && git push)
