name: Mettre à jour les Sélections Grist

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: pip install requests

      - name: Exécuter le script
        env:
          GRIST_API_KEY: ${{ secrets.GRIST_API_KEY }}
        run: python scripts/build_selections.py

      - name: Déposer selections.json sur la branche gh-pages
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # On déplace le fichier hors du dépôt pour que Git soit totalement propre
          mv selections.json /tmp/selections.json
          
          # On bascule proprement sur gh-pages avec force (-f)
          git fetch origin gh-pages
          git checkout -f -B gh-pages origin/gh-pages
          
          # On remet le fichier à sa place sur gh-pages
          mv /tmp/selections.json ./selections.json
          
          # Enregistrement et publication
          git add selections.json
          git diff --staged --quiet || (git commit -m "Mise à jour automatique de selections.json [skip ci]" && git push origin gh-pages)
