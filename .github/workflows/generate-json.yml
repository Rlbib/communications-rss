name: Génération Automatique Agenda JSON

on:
  schedule:
    # S'exécute automatiquement toutes les 6 heures
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permet de lancer la génération manuellement depuis l'interface GitHub

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Donne le droit d'écrire et de pousser le fichier agenda.json généré

    steps:
    - name: Récupération du code source
      uses: actions/checkout@v4

    - name: Configuration de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install requests python-dateutil

    - name: Exécution du script de génération JSON
      run: python scripts/generate_json.py

    - name: Commit et Push du fichier agenda.json
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add agenda.json
        if git diff --staged --quiet; then
          echo "Aucune modification détectée dans l'agenda."
        else
          git commit -m "Mise à jour automatique de l'agenda JSON [skip ci]"
          git push
        fi
